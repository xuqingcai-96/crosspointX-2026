services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      PUBLIC_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      DIFY_API_KEY: ${DIFY_API_KEY:-}
      DIFY_BASE_URL: ${DIFY_BASE_URL:-https://api.dify.ai/v1}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-100}
    expose:
      - "8080"
    volumes:
      - classroom-data:/app/data
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
volumes:
  classroom-data:
  caddy-data:
  caddy-config:
